# TraceLens v2 overlay — merged on top of project config.yaml by main2.py
#
# Usage: python main2.py --llm --vlm --source areeb_salem

v2:
  fusion:
    text: 0.28
    navigation: 0.12
    causal_action: 0.20
    observer_symptom: 0.20
    visual_causal: 0.14
    pixel: 0.12
    llm_prior: 0.28   # 60% of model channels (matches v1 ensemble 60/40)
    vlm_prior: 0.18   # 40% of model channels
    downstream_penalty: 0.05
    downstream_text_exempt: 0.25  # no vc-downstream penalty when text signal is this strong
    observer_after_causal_cap: 0.55
    observer_after_causal_min_text: 0.5
    observer_vlm_cap: 0.2
    vlm_root_llm_min: 0.75
    causal_llm_bonus: 0.06
    vlm_root_bonus: 0.05
    action_llm_bonus: 0.05
  strong_observer_pixel: 0.95

outputs:
  rankings: "outputs/v2/rankings"
  reports: "outputs/v2/reports"
  metrics: "outputs/v2/metrics"
