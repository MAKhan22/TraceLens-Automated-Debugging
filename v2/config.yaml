# TraceLens v2 overlay — merged on top of project config.yaml by main2.py
#
# Usage: python main2.py --llm --vlm --source areeb_salem

v2:
  fusion:
    text: 0.28
    navigation: 0.12
    causal_action: 0.20
    observer_symptom: 0.20
    visual_causal: 0.14
    pixel: 0.12
    llm_prior: 0.24
    vlm_prior: 0.24
    downstream_penalty: 0.05
  strong_observer_pixel: 0.95

outputs:
  rankings: "outputs/v2/rankings"
  reports: "outputs/v2/reports"
  metrics: "outputs/v2/metrics"
