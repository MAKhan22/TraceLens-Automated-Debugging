# TraceLens configuration

data:
  raw_base: "data/relative debugging-20260518T094544Z-3-001/relative debugging"
  processed_dir: "data/processed"
  ground_truth: "data/evaluation/ground_truth.json"

  # Paths relative to raw_base
  sources:
    efe_irem:
      base: "efe- irem traces"
      traces:
        - { id: "saucedemo_1",  pass: "saucedemo_1/saucedemo_1_correct.json",   fail: "saucedemo_1/saucedemo_1_incorrect.json" }
        - { id: "saucedemo_2",  pass: "saucedemo_2/saucedemo_2_correct.json",   fail: "saucedemo_2/saucedemo_2_incorrect.json" }
        - { id: "gutenberg",    pass: "gutenberg/gutenberg_correct.json",        fail: "gutenberg/gutenberg_incorrect.json" }
        - { id: "dictionary",   pass: "dictionary/dictionary-correct.json",      fail: "dictionary/dictionary-incorrect.json" }
        - { id: "webmd",        pass: "webmd/webmd-correct.json",                fail: "webmd/webmd-incorrect.json" }
        - { id: "wolfram",      pass: "wolfram mathworld/wolfram-correct.json",  fail: "wolfram mathworld/wolfram-incorrect.json" }
        - { id: "elinguistics", pass: "elinguistics/elinguistics_correct.json",  fail: "elinguistics/elinguistics_incorrect.json" }
        - { id: "wikipedia",    pass: "wikipedia/wikipedia_correct.json",        fail: "wikipedia/wikipedia_incorrect.json" }

    areeb_salem:
      base: "areeb & salem traces"
      traces:
        - { id: "amazon",      pass: "amazon/pass/trace_pass.json",       fail: "amazon/fail/trace_fail.json" }
        - { id: "bbc",         pass: "bbc/pass/trace_pass.json",          fail: "bbc/fail/trace_fail.json" }
        - { id: "github",      pass: "github/pass/trace_pass.json",       fail: "github/fail/trace_fail.json" }
        - { id: "hackernews",  pass: "hackernews/pass/trace_pass.json",   fail: "hackernews/fail/trace_fail.json" }
        - { id: "imdb",        pass: "imdb/pass/trace_pass.json",         fail: "imdb/fail/trace_fail.json" }
        - { id: "npm",         pass: "npm/pass/trace_pass.json",          fail: "npm/fail/trace_fail.json" }
        - { id: "producthunt", pass: "producthunt/pass/trace_pass.json",  fail: "producthunt/fail/trace_fail.json" }
        - { id: "pypi",        pass: "pypi/pass/trace_pass.json",         fail: "pypi/fail/trace_fail.json" }
        - { id: "wikipedia",   pass: "wikipedia/pass/trace_pass.json",    fail: "wikipedia/fail/trace_fail.json" }
        - { id: "youtube",     pass: "youtube/pass/trace_pass.json",      fail: "youtube/fail/trace_fail.json" }

    ersel:
      base: "ersel-ikra-merve traces"
      traces:
        - { id: "opencart_purchase_40",         pass: "opencart_purchase_40/passing",         fail: "opencart_purchase_40/failing" }
        - { id: "opencart_wishlist_35",         pass: "opencart_wishlist_35/passing",         fail: "opencart_wishlist_35/failing" }
        - { id: "opencart_manufacturer_404_35", pass: "opencart_manufacturer_404_35/passing", fail: "opencart_manufacturer_404_35/failing" }
        - { id: "opencart_contact_35",          pass: "opencart_contact_35/passing",          fail: "opencart_contact_35/failing" }

model:
  # --- Active provider ---
  base_url:    "https://openrouter.ai/api/v1"
  llm_model:   "nvidia/nemotron-3-super-120b-a12b:free"
  api_key_env: "OPENROUTER_API_KEY"
  temperature: 0.1

  # --- OpenRouter: Qwen3 Coder (1M ctx — Venice backend, congested) ---
  # llm_model:   "qwen/qwen3-coder:free"

  # --- OpenRouter: Qwen3 Next 80B (strong reasoning — Venice backend, congested) ---
  # llm_model:   "qwen/qwen3-next-80b-a3b-instruct:free"

  # --- OpenRouter: Gemma 4 31B (strong JSON adherence) ---
  # llm_model:   "google/gemma-4-31b-it:free"

  # --- OpenRouter: Llama 3.3 70B (reliable fallback, 200 req/day) ---
  # llm_model:   "meta-llama/llama-3.3-70b-instruct:free"

  # --- OpenRouter: Nemotron Super 120B (1M ctx, good reasoning) ---
  # llm_model:   "nvidia/nemotron-3-super-120b-a12b:free"

  # --- Groq 70B (higher quality, lower TPM limit) ---
  # base_url:    "https://api.groq.com/openai/v1"
  # llm_model:   "llama-3.3-70b-versatile"
  # api_key_env: "GROQ_API_KEY"
  # NOTE: 100k tokens/day — runs out after ~1.5 full 22-trace runs

  # --- Gemini Flash (best quota but trains on free-tier data) ---
  # base_url:    "https://generativelanguage.googleapis.com/v1beta/openai/"
  # llm_model:   "gemini-2.0-flash"
  # api_key_env: "GEMINI_API_KEY"

vlm:
  # --- Active VLM provider (OpenRouter) ---
  base_url:    "https://api.groq.com/openai/v1"
  vlm_model:   "meta-llama/llama-4-scout-17b-16e-instruct"
  api_key_env: "GROQ_API_KEY"   # same key as LLM
  temperature: 0.1

  # One API call per screenshot pair (more reliable than batching 5 pairs)
  per_step: true

  # --- Groq (fast VLM — free tier, separate from OpenRouter) ---
  # base_url:    "https://api.groq.com/openai/v1"
  # vlm_model:   "meta-llama/llama-4-scout-17b-16e-instruct"
  # api_key_env: "GROQ_API_KEY"
  # Test: python scripts/test_vlm_models.py --provider groq

  # --- Google AI Studio (Gemini direct — separate quota from OpenRouter) ---
  # base_url:    "https://generativelanguage.googleapis.com/v1beta/openai/"
  # vlm_model:   "gemini-2.0-flash"
  # api_key_env: "GEMINI_API_KEY"
  # Get key: https://aistudio.google.com/apikey
  # Test: python scripts/test_vlm_models.py --provider gemini --models gemini-2.0-flash

  # --- OpenRouter VLM alternatives (uncomment to switch) ---
  # Paid (requires OpenRouter credits):
  # vlm_model:   "qwen/qwen2.5-vl-72b-instruct"   # no 7B free tier on OpenRouter
  # vlm_model:   "qwen/qwen3-vl-8b-instruct"
  # Free (daily rate limit — test with scripts/test_vlm_models.py):
  # vlm_model:   "google/gemma-4-31b-it:free"
  # vlm_model:   "google/gemma-4-26b-a4b-it:free"
  # vlm_model:   "nvidia/nemotron-nano-12b-v2-vl:free"

  # How much VLM visual scores influence the final combined ranking (0.0–1.0)
  # 0.4 = 60% LLM text + 40% VLM visual
  ensemble_vlm_weight: 0.4

  # How many top-ranked steps to send to VLM (API cost control — one call per pair
  # when per_step: true). Visual-causal steps are injected on top of this limit.
  top_k_for_vlm: 5

ranking:
  top_k: 5          # final output size
  pre_llm_k: 0      # candidates sent to LLM for re-ranking (0 = all steps, no heuristic bottleneck)
  heuristic_pixel_fallback: true   # heuristic-only mode: boost ranking with local pixel diff
  heuristic_pixel_weight: 0.35     # blend weight for pixel diff in heuristic-only mode
  visual_causal:
    enabled: true
    min_divergence: 0.05      # earliest persistent pass/fail screenshot diff (localized form band)
    max_self_pixel: 0.15       # previous step must still look similar for symptom attribution
    max_action_score: 0.1      # step must have weak text signals
    divergent_window: 2        # steps ±N around first divergence sent to VLM

weights:
  network: 0.35
  console: 0.25
  action:  0.15
  intent:  0.25

outputs:
  rankings: "outputs/rankings"
  reports:  "outputs/reports"
  metrics:  "outputs/metrics"
